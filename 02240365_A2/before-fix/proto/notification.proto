syntax = "proto3";

package notification;

option go_package = "ecommerce-microservices/proto";

// NotificationService pushes a sequence of order-status updates back to
// a client. SubscribeNotifications is a SERVER-STREAMING RPC: the client
// sends one request and receives multiple responses over time.
service NotificationService {
  rpc SubscribeNotifications (SubscribeRequest) returns (stream Notification);
}

message SubscribeRequest {
  string customer_id = 1;
  string order_id = 2;
}

message Notification {
  string message = 1;
  string timestamp = 2;
}
