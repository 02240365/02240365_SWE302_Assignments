<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reviews - Ecom Microservices Store</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body data-page="reviews">

  <header class="topbar">
    <a class="brand" href="/" data-cy="brand" aria-label="Ecom Microservices Store home">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
      <span>Ecom Microservices Store</span>
    </a>
    <nav class="nav" data-cy="nav" aria-label="Main"><a href="/" data-cy="nav-home" data-page="home">Home</a><a href="/shop.html" data-cy="nav-shop" data-page="shop">Shop</a><a href="/cart.html" data-cy="nav-cart" data-page="cart">Cart</a><a href="/reviews.html" data-cy="nav-reviews" data-page="reviews">Reviews</a><a href="/orders.html" data-cy="nav-orders" data-page="orders">Orders</a><a href="/status.html" data-cy="nav-status" data-page="status">Status</a></nav>
    <div class="header-fields">
      <div class="customer-field">
        <label for="customer-id">Customer ID</label>
        <input id="customer-id" type="text" placeholder="e.g. C001" data-cy="customer-id" />
      </div>
      <div class="customer-field">
        <label for="coupon-code">Coupon</label>
        <input id="coupon-code" type="text" placeholder="optional" data-cy="coupon-code" />
        <button type="button" id="coupon-check-btn" class="small-btn" data-cy="coupon-check-btn">Check</button>
      </div>
    </div>
  </header>

  <main class="content" data-cy="page-reviews">
    <header class="page-header">
      <h1 data-cy="page-title">Product Reviews</h1>
      <p class="subtitle">Read what other customers say, or write your own review</p>
    </header>
    <section class="card" data-cy="reviews-section" id="reviews-section">
      <div class="input-row">
        <select id="review-product" data-cy="review-product" aria-label="Product to review"></select>
        <button type="button" id="review-load-btn" class="small-btn" data-cy="review-load-btn">Show reviews</button>
      </div>
      <div id="review-summary" class="review-summary" data-cy="review-summary"></div>
      <ul id="review-list" class="review-list" data-cy="review-list"></ul>
    </section>
    <section class="card" data-cy="review-write-section">
      <header class="card-header"><h2>Write a review</h2></header>
      <form id="review-form" class="review-form" autocomplete="off">
        <label for="review-rating">Rating</label>
        <select id="review-rating" data-cy="review-rating">
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Good</option>
          <option value="3">3 - Average</option>
          <option value="2">2 - Poor</option>
          <option value="1">1 - Terrible</option>
        </select>
        <textarea id="review-comment" rows="3" placeholder="Write your review (up to 200 characters)" data-cy="review-comment"></textarea>
        <button type="submit" id="review-submit" class="primary-btn" data-cy="review-submit">Submit review</button>
      </form>
      <div id="review-message" class="result" aria-live="polite" data-cy="review-message"></div>
    </section>
  </main>

  <footer class="footer" data-cy="footer">
    <span>Ecom Microservices Store &middot; ten gRPC microservices behind one gateway</span>
    <span class="footer-links"><a href="/shop.html">Shop</a><a href="/orders.html">Track an order</a><a href="/status.html">System status</a></span>
  </footer>

  <div id="toast-container" class="toast-container" aria-live="polite" data-cy="toast-container"></div>

  <script src="/common.js"></script>
  <script src="/reviews.js"></script>
</body>
</html>
