<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>System Status - Ecom Microservices Store</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body data-page="status">

  <header class="topbar">
    <a class="brand" href="/" data-cy="brand" aria-label="Ecom Microservices Store home">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
      <span>Ecom Microservices Store</span>
    </a>
    <nav class="nav" data-cy="nav" aria-label="Main"><a href="/" data-cy="nav-home" data-page="home">Home</a><a href="/shop.html" data-cy="nav-shop" data-page="shop">Shop</a><a href="/cart.html" data-cy="nav-cart" data-page="cart">Cart</a><a href="/reviews.html" data-cy="nav-reviews" data-page="reviews">Reviews</a><a href="/orders.html" data-cy="nav-orders" data-page="orders">Orders</a><a href="/status.html" data-cy="nav-status" data-page="status">Status</a></nav>
    <div class="header-fields">
      <div class="customer-field">
        <label for="customer-id">Customer ID</label>
        <input id="customer-id" type="text" placeholder="e.g. C001" data-cy="customer-id" />
      </div>
      <div class="customer-field">
        <label for="coupon-code">Coupon</label>
        <input id="coupon-code" type="text" placeholder="optional" data-cy="coupon-code" />
        <button type="button" id="coupon-check-btn" class="small-btn" data-cy="coupon-check-btn">Check</button>
      </div>
    </div>
  </header>

  <main class="content" data-cy="page-status">
    <header class="page-header">
      <h1 data-cy="page-title">System Status</h1>
      <p class="subtitle">The ten microservices behind this store</p>
    </header>
    <section class="card" data-cy="status-section" id="status-section">
      <div class="row-actions">
        <button type="button" id="status-refresh-btn" class="small-btn" data-cy="status-refresh-btn">Check services</button>
        <span id="discount-mode" class="muted" data-cy="discount-mode"></span>
      </div>
      <ul id="status-list" class="status-list" data-cy="status-list"></ul>
    </section>
  </main>

  <footer class="footer" data-cy="footer">
    <span>Ecom Microservices Store &middot; ten gRPC microservices behind one gateway</span>
    <span class="footer-links"><a href="/shop.html">Shop</a><a href="/orders.html">Track an order</a><a href="/status.html">System status</a></span>
  </footer>

  <div id="toast-container" class="toast-container" aria-live="polite" data-cy="toast-container"></div>

  <script src="/common.js"></script>
  <script src="/status.js"></script>
</body>
</html>
